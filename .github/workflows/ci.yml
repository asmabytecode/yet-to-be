name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Найменші права за замовчуванням; jobs розширюють їх точково.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit + integration (coverage), build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Версія pnpm береться з "packageManager" у package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests with coverage thresholds
        run: pnpm test:cov

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Build (web build includes check-dist-secrets)
        run: pnpm build

  e2e:
    name: E2E (Playwright × 3 browsers against docker compose)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YTB_ENV_FILE: .env.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Одноразові секрети саме для цього запуску; Google — mock.
      - name: Generate CI environment
        run: pnpm secrets:generate --ci

      - name: Start stack (e2e mode)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for readiness
        run: pnpm stack:wait

      - name: Security headers
        run: pnpm check:headers

      - name: Install Playwright browsers
        run: pnpm --filter web test:e2e:install

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
