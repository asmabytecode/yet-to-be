# Підключається головним nginx.conf образу nginx-unprivileged усередині http {}.
server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# S3 (SeaweedFS) для роздачі готових зображень. upstream, а не змінна в proxy_pass — тоді не потрібен resolver.
upstream media_s3 {
  server seaweedfs:8333;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API приймає тіла до 100 KB; більші відсікаються ще тут.
  client_max_body_size 128k;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Healthcheck контейнера (не проксіюється, не логиться).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  # Завантаження медіа (Етап 14.6): єдиний маршрут з більшим лімітом тіла. API ще раз
  # перевіряє розмір, тип за вмістом і антивірусом.
  location = /api/v1/admin/media {
    limit_req zone=api burst=10 nodelay;
    client_max_body_size 11m;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  # Готові зображення: лише згенеровані сервером webp, лише GET/HEAD, без листингу bucket-а.
  # Навіть якби файл містив HTML/JS, sandbox-CSP і nosniff не дадуть його виконати.
  location /media/ {
    location ~ "^/media/([0-9a-f-]{36}/(?:thumb|md|lg)-[0-9a-f]{12}\.webp)$" {
      limit_except GET HEAD {
        deny all;
      }
      proxy_pass http://media_s3/ytb-media/$1;
      proxy_http_version 1.1;
      proxy_set_header Host seaweedfs:8333;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_hide_header Server;
      proxy_hide_header Set-Cookie;
      proxy_ignore_headers Set-Cookie;
      include /etc/nginx/snippets/security-headers.conf;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      add_header Content-Disposition "inline" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    return 404;
  }

  # Файли з хешем у назві — кешуються назавжди.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Адмінка (Етап 14.8): окремий бандл під /admin/ — публічний сайт не містить її коду.
  # Пошуковики її не індексують; index.html не кешується, бандли з хешем — назавжди.
  location = /admin {
    absolute_redirect off;
    return 301 /admin/;
  }
  location /admin/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /admin/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files $uri /admin/index.html;
  }

  # SPA: index.html ніколи не кешується, щоб після деплою підтягувалась нова версія.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }

  # .env, .git та інші приховані файли; source maps не віддаються ніколи.
  location ~ /\. {
    deny all;
  }
  location ~* \.map$ {
    return 404;
  }
}
