# Підключається головним nginx.conf образу nginx-unprivileged усередині http {}.
server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API приймає тіла до 100 KB; більші відсікаються ще тут.
  client_max_body_size 128k;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Healthcheck контейнера (не проксіюється, не логиться).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    # Ці заголовки вже додає Nginx на рівні server — копії від API прибираємо, щоб не дублювались.
    # CSP від API (default-src 'none') лишається: браузер застосовує обидві політики, діє суворіша.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
  }

  # Файли з хешем у назві — кешуються назавжди.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA: index.html ніколи не кешується, щоб після деплою підтягувалась нова версія.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }

  # .env, .git та інші приховані файли; source maps не віддаються ніколи.
  location ~ /\. {
    deny all;
  }
  location ~* \.map$ {
    return 404;
  }
}
