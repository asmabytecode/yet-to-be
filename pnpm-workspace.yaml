packages:
  - "apps/*"
  - "packages/*"
  - "scripts"

# pnpm 10 блокує build-скрипти залежностей за замовчуванням.
# Дозволяємо лише ті, що справді потрібні (нативні модулі).
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
  - argon2
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

# Закриваємо вразливість у транзитивній залежності Prisma CLI (ReDoS, GHSA-7589-6fvf-x4pw).
overrides:
  effect: "^3.22.1"
