# Захисні заголовки SPA. У Nginx add_header НЕ успадковується в location, де є власний
# add_header, тому цей snippet підключається в кожен такий блок (перевіряє scripts/check-headers.mjs).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Strict-Transport-Security — лише там, де термінується TLS (балансувальник / Caddy / Traefik).
