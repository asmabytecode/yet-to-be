# Спільні налаштування проксі до API (підключаються в кожному location, що веде на API).
proxy_pass http://api:3000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header X-Powered-By;
# Ці заголовки вже додає Nginx на рівні server — копії від API прибираємо, щоб не дублювались.
# CSP від API (default-src 'none') лишається: браузер застосовує обидві політики, діє суворіша.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
