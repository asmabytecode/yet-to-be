title = "YET TO BE gitleaks config"

[extend]
useDefault = true

# NOTE: gitleaks uses the RE2 engine, which has no lookahead/lookbehind.
# Placeholders ("change-me") are excluded via a rule-level allowlist instead.
[[rules]]
id = "yettobe-env-secret"
description = "Hard-coded application secret"
regex = '''(?i)(JWT_ACCESS_SECRET|PASSWORD_PEPPER|COOKIE_SECRET|BLIND_INDEX_KEY|GOOGLE_CLIENT_SECRET)\s*[=:]\s*['"]?[A-Za-z0-9+/=_\-]{16,}'''
tags = ["secret", "yettobe"]

[[rules.allowlists]]
description = "Documented placeholders are not secrets"
regexTarget = "match"
regexes = [
  '''(?i)change-me''',
]

[[rules.allowlists]]
description = "Obvious test values inside test files and fixtures"
paths = [
  '''\.(spec|test)\.[cm]?[jt]sx?$''',
  '''\.fixture\.[cm]?[jt]s$''',
]

[allowlist]
description = "Only the example env file may contain placeholders"
paths = [
  '''\.env\.example$''',
]
